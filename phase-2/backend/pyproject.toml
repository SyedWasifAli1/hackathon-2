[project]
name = "todo-backend"
version = "0.1.0"
description = "Todo application backend using FastAPI and SQLModel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29.0",
    "python-jose>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.12.0",
    "aiosqlite>=0.22.1",
    "openai>=1.0.0",
]
